<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock In - Clinic Daily</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="logo">📊 Clinic Daily</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="stock-in.html" class="active">Stock In</a>
            <a href="stock-out.html">Stock Out</a>
            <a href="reports.html">Reports</a>
            <span style="margin-left: 20px;">|</span>
            <span style="margin-left: 20px; font-size: 12px;">User: <span id="userEmail"></span></span>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <h2>Record Stock In</h2>
                </div>
                <form id="stockInForm">
                    <div class="form-group">
                        <label for="itemId">Item *</label>
                        <select id="itemId" name="itemId" required>
                            <option value="">-- Loading items --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantityIn">Quantity In *</label>
                        <input type="number" id="quantityIn" name="quantityIn" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="unitCost">Unit Cost ($)</label>
                        <input type="number" id="unitCost" name="unitCost" min="0" step="0.01" value="0">
                    </div>
                    <div class="form-group">
                        <label for="supplier">Supplier</label>
                        <input type="text" id="supplier" name="supplier" placeholder="Supplier name">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Additional notes"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Record Stock In</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Recent Stock In Records</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Item</th>
                            <th>Quantity</th>
                            <th>Unit Cost</th>
                            <th>Supplier</th>
                            <th>Received By</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="7" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/stockIn.js"></script>
</body>
</html>
